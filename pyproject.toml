[project]
name = "kvm-mcp"
version = "0.2.0"
description = "Platform-independent MCP and web applications for hardware KVMs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiortc>=1.14,<2",
    "anyio>=4,<5",
    "mcp>=1.12,<2",
    "kvm-automation",
    "starlette>=0.40,<2",
    "uvicorn[standard]>=0.30,<1",
    "av>=14,<18",
]

[project.optional-dependencies]
rock5b-plus = ["kvm-rock5b-plus"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.scripts]
kvm-mcp = "kvm_mcp.bootstrap:mcp_main"
kvm-web = "kvm_mcp.bootstrap:web_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"kvm_mcp.app" = ["static/*"]

[tool.uv.workspace]
members = ["packages/automation", "packages/rock5b-plus"]

[tool.uv.sources]
kvm-automation = { workspace = true }
kvm-rock5b-plus = { workspace = true }
