[project]
name = "kvm-mcp"
version = "0.3.0"
description = "Computer automation, visual recording, MCP and web interfaces for KVMs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiortc>=1.14,<2",
    "anyio>=4,<5",
    "av>=14,<18",
    "mcp>=1.12,<2",
    "numpy>=2,<3",
    "opencv-python-headless>=4.10,<5",
    "pillow>=11,<13",
    "python-xlib>=0.33,<1",
    "starlette>=0.40,<2",
    "uvicorn[standard]>=0.30,<1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.scripts]
kvm-mcp = "kvm.cli.main:mcp_main"
kvm-web = "kvm.cli.main:web_main"
kvm-inspect = "kvm.cli.inspect:main"
rock5b-plus-gadget = "kvm.platforms.rock5b_plus.gadget:main"
rock5b-plus-hdmi = "kvm.platforms.rock5b_plus.hdmi:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"kvm.interfaces.web" = ["static/*"]
"kvm.platforms.rock5b_plus" = ["edid/*.bin"]
