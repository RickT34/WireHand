[project]
name = "kvm-mcp"
version = "0.2.0"
description = "Platform-independent MCP and web applications for hardware KVMs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiortc>=1.14,<2",
    "anyio>=4,<5",
    "mcp>=1.12,<2",
    "numpy>=2,<3",
    "opencv-python-headless>=4.10,<5",
    "pillow>=11,<13",
    "starlette>=0.40,<2",
    "uvicorn[standard]>=0.30,<1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.scripts]
kvm-mcp = "kvm_mcp.bootstrap:mcp_main"
kvm-web = "kvm_mcp.bootstrap:web_main"
kvm-inspect = "kvm_mcp.app.vision.cli:main"
rock5b-plus-gadget = "kvm_mcp.platforms.rock5b_plus.gadget:main"
rock5b-plus-hdmi = "kvm_mcp.platforms.rock5b_plus.hdmi:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"kvm_mcp.app" = ["static/*"]
"kvm_mcp.platforms.rock5b_plus" = ["edid/*.bin"]
