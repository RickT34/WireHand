# Include inside nginx's http {} block (for example sites-enabled/kvm.conf).
# Replace server_name, certificates and upstream address for your deployment.
map $http_upgrade $kvm_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl;
    server_name kvm.example.com;
    ssl_certificate     /etc/letsencrypt/live/kvm.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kvm.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $kvm_connection_upgrade;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Overwrite untrusted client forwarding headers at this edge proxy.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 30s;
        proxy_send_timeout 10s;
    }
}
