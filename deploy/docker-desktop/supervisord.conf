[supervisord]
nodaemon=true
user=root
logfile=/dev/null
pidfile=/run/kvm-mcp/supervisor.pid
childlogdir=/run/kvm-mcp

[program:dbus]
command=/usr/bin/dbus-daemon --session --nofork --address=unix:path=/run/kvm-mcp/session-bus
user=agent
priority=10
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:xserver]
command=/usr/bin/Xvfb :99 -screen 0 %(ENV_KVM_DESKTOP_RESOLUTION)sx24 -nolisten tcp -ac +extension XTEST
user=agent
priority=10
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:desktop]
command=/bin/bash /opt/desktop/session.sh
user=agent
priority=20
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:web]
command=/opt/venv/bin/wirehand-web
user=agent
priority=30
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
