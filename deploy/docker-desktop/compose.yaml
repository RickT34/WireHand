name: kvm-desktop
services:
  desktop:
    image: wirehand/desktop:local
    build:
      context: ../..
      dockerfile: deploy/docker-desktop/Dockerfile
    hostname: kvm-desktop
    restart: unless-stopped
    ports:
      - "${KVM_DESKTOP_BIND:-127.0.0.1}:${KVM_DESKTOP_PORT:-18810}:8080"
    environment:
      KVM_TOKEN: ${KVM_TOKEN:?Run ./deploy/docker-desktop/desktopctl init first}
      KVM_HOSTS: ${KVM_HOSTS:-localhost,127.0.0.1}
      KVM_TRUSTED_PROXIES: ${KVM_TRUSTED_PROXIES:-}
      KVM_DESKTOP_RESOLUTION: ${KVM_DESKTOP_RESOLUTION:-1280x800}
    shm_size: 512mb
    pids_limit: 512
    volumes:
      - home:/home/agent
      - workspace:/workspace
      - state:/var/lib/kvm-mcp
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  home:
  workspace:
  state:
