[project]
name = "kvm-rock5b-plus"
version = "0.1.0"
description = "ROCK 5B+ capture and input adapter for kvm-automation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["kvm-automation", "av>=14,<18"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.entry-points."kvm_automation.backends"]
rock5b-plus = "kvm_rock5b_plus.backend:Rock5BPlusBackend"

[project.scripts]
rock5b-plus-gadget = "kvm_rock5b_plus.gadget:main"
rock5b-plus-hdmi = "kvm_rock5b_plus.hdmi:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kvm_rock5b_plus = ["edid/*.bin"]

[tool.uv.sources]
kvm-automation = { workspace = true }
